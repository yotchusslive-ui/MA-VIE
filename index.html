<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MA VIE — Cockpit</title>
<meta name="theme-color" content="#07111f">
<style>
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#eef5ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}
.hero{margin:0 14px 18px;border-radius:0 0 28px 28px;overflow:hidden;position:relative;min-height:235px;background:linear-gradient(135deg,#0b1b31,#102f4d 55%,#07111f)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(5,11,20,.92) 100%)}
.hero .art{position:absolute;inset:0;background:radial-gradient(circle at 75% 25%,rgba(91,193,255,.35),transparent 25%),radial-gradient(circle at 25% 20%,rgba(108,99,255,.25),transparent 30%)}
.hero-content{position:relative;padding:28px 24px 22px;display:flex;flex-direction:column;justify-content:flex-end;min-height:235px}
.kicker{font-size:12px;letter-spacing:2px;color:#8fa9c6;font-weight:700}.title{font-size:35px;font-weight:900;letter-spacing:-1.5px;margin:4px 0}.date{color:#a9bfd8;font-size:14px}
.quote{margin-top:15px;color:#dce9f7;font-size:13px;max-width:330px;line-height:1.45}
section{padding:0 16px}.card{background:rgba(15,28,45,.78);border:1px solid rgba(145,185,220,.12);border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 10px 35px rgba(0,0,0,.18)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#8fa4bc}.small{font-size:12px}.label{font-size:12px;color:#8fa4bc;text-transform:uppercase;letter-spacing:1.3px;font-weight:800}
.weight{display:flex;align-items:end;gap:10px;margin:5px 0}.weight b{font-size:42px;line-height:1;font-weight:900}.weight span{color:#93aac2;font-size:14px;margin-bottom:5px}.target{font-size:13px;color:#a8c4de}.bar{height:7px;background:#26384c;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#56c6ff,#7ee0bd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#0b1726;border-radius:15px;padding:12px}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:#8098b2}
.priority{border-left:3px solid #62d3ff}.priority p{margin:5px 0 0;font-weight:750}
.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(150,180,210,.08)}.task:last-child{border:0}.task .ico{font-size:21px}.task .txt{flex:1}.task small{display:block;color:#839ab2;margin-top:2px}
.check{width:26px;height:26px;border-radius:8px;border:1px solid #40546c;background:#0b1726;color:#74dcbd}.check.done{background:#173b35}
.btn{border:0;border-radius:12px;padding:8px 11px;background:#18304a;color:#bfe2ff;font-weight:800;font-size:12px}.btn.primary{background:linear-gradient(135deg,#257cb8,#4fbfbd);color:#04111c}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(5,11,20,.94);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(150,190,230,.1);z-index:5}.tab{border:0;background:transparent;color:#7189a3;font-size:11px;font-weight:800;padding:8px 2px}.tab.active{color:#dff4ff}.tab div{font-size:19px;margin-bottom:2px}
.page{display:none}.page.active{display:block}
.inputrow{display:flex;gap:8px;margin-top:10px}.inputrow input{flex:1;background:#081522;border:1px solid #263b51;color:#fff;border-radius:12px;padding:11px}.empty{color:#71869d;text-align:center;padding:20px;font-size:13px}
.pill{padding:5px 8px;border-radius:9px;font-size:10px;font-weight:900}.prep{background:#4a3415;color:#ffcf76}.doing{background:#4a2025;color:#ff929b}.donepill{background:#173d35;color:#7fe2be}
.footer{text-align:center;color:#536980;font-size:10px;padding:20px}

.weight-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(150,180,210,.08)}
.weight-row:last-child{border:0}.delta-down{color:#7fe2be;font-weight:800}.delta-up{color:#ff9a9a;font-weight:800}

</head>
<body>
<div class="app">
<header class="hero"><div class="art"></div><div class="hero-content">
<div class="kicker">COCKPIT PERSONNEL</div><div class="title">MA VIE</div>
<div class="date" id="date"></div>
<div class="quote">Pas besoin d’être parfait. Il faut simplement avancer, même les jours moyens.</div>
</div></header>

<main>
<div id="today" class="page active">
<section>
<div class="card priority"><div class="label">Priorité absolue</div><p id="priority">Prendre mes 3 cachets</p></div>
<div class="card"><div class="label">Forme · pesée toutes les 2 semaines</div>
<div class="weight"><b id="currentWeight">118</b><span>kg</span></div>
<div class="target">Objectif <b>108 kg</b> · −10 kg</div>
<div class="bar"><i id="weightbar"></i></div>
<div id="weighingInfo" class="muted small" style="margin-top:10px"></div>
<div class="inputrow"><input id="weightInput" type="number" min="50" max="250" step="0.1" placeholder="Ex. 117,4 kg"><button class="btn primary" onclick="saveWeight()">Enregistrer</button></div>
<div id="weightError" class="small" style="color:#ff9a9a;margin-top:7px"></div>
</div>
<div class="card"><div class="label">Historique du poids</div><div id="weightHistory"></div></div>
<div class="stats"><div class="stat"><strong id="streak">0</strong><span>jours d'affilée</span></div><div class="stat"><strong id="gym">0</strong><span>cardio</span></div><div class="stat"><strong id="walk">0</strong><span>marche</span></div></div>
<div class="card" style="margin-top:14px"><div class="label">Aujourd’hui</div><div id="daily"></div></div>
<div class="card"><div class="label">Travaux en cours</div><div id="workMini"></div></div>
</section>
</div>

<div id="work" class="page"><section>
<div class="row" style="margin:8px 2px 14px"><div><div class="label">Travaux</div><div class="muted small">Simple. Trois états. Rien de plus.</div></div><button class="btn primary" onclick="addWork()">＋ Ajouter</button></div>
<div class="card"><div id="works"></div></div>
<div class="card"><div class="label">Historique</div><div id="history"></div></div>
</section></div>

<div id="reminders" class="page"><section>
<div class="row" style="margin:8px 2px 14px"><div><div class="label">Rappels</div><div class="muted small">Calendrier + tâches du jour</div></div></div>
<div class="card"><div class="label">Google Calendar</div>
<div id="calendar"><div class="empty">La synchronisation réelle nécessite l'autorisation Google Calendar. Le bouton ci-dessous est prêt pour la connexion OAuth.</div>
<button class="btn primary" style="width:100%;margin-top:4px" onclick="connectGoogle()">🔗 Connecter Google Calendar</button></div></div>
<div class="card"><div class="label">Tâches du jour</div><div id="todayTasks"></div></div>
</section></div>

<div id="progress" class="page"><section>
<div class="card"><div class="label">Progression</div><div class="stats" style="margin-top:10px"><div class="stat"><strong>118 → 108</strong><span>objectif poids</span></div><div class="stat"><strong id="g2">0</strong><span>séances cardio</span></div><div class="stat"><strong id="gu2">0</strong><span>jours guitare</span></div></div></div>
<div class="card"><div class="label">Règle du jeu</div><p class="muted" style="line-height:1.55">Minimum les mauvais jours. Régularité avant intensité. Le but est de devenir plus solide, pas de remplir une application de cases.</p></div>
</section></div>
</main>

<nav class="tabs">
<button class="tab active" data-page="today"><div>⌂</div>Aujourd’hui</button>
<button class="tab" data-page="work"><div>🛠</div>Travaux</button>
<button class="tab" data-page="reminders"><div>📅</div>Rappels</button>
<button class="tab" data-page="progress"><div>◈</div>Progrès</button>
</nav>
<div class="footer">MA VIE · cockpit personnel</div>
</div>

<script>
const KEY='ma_vie_final_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"works":[{"name":"Porte de garage","icon":"🚪","status":"prep"},{"name":"Jardin","icon":"🌳","status":"prep"},{"name":"Chambre Chloé","icon":"💡","status":"prep"}],"history":[],"checks":{},"stats":{"gym":0,"walk":0,"guitar":0,"streak":0},"weights":[{"date":"2026-11-03","value":118}]}');
data.weights = Array.isArray(data.weights) ? data.weights : [{date:"2026-11-03",value:118}];
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function dateFR(){return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}
document.getElementById('date').textContent=dateFR().replace(/^./,c=>c.toUpperCase());
function workLabel(s){return s==='prep'?'PRÉPARATION':s==='doing'?'EN COURS':'TERMINÉ'}
function renderWorks(){
 const active=data.works.filter(x=>x.status!=='done');
 document.getElementById('works').innerHTML=active.length?active.map((x,i)=>`<div class="task"><span class="ico">${x.icon}</span><div class="txt"><b>${esc(x.name)}</b><small>${workLabel(x.status)}</small></div><button class="btn ${x.status==='prep'?'':''}" onclick="cycleWork(${data.works.indexOf(x)})">${x.status==='prep'?'🟠':x.status==='doing'?'🔴':'🟢'}</button></div>`).join(''):'<div class="empty">Aucun travail en cours.</div>';
 document.getElementById('history').innerHTML=data.history.length?data.history.slice().reverse().map(x=>`<div class="task"><span class="ico">${x.icon}</span><div class="txt"><b>${esc(x.name)}</b><small>Terminé le ${x.date}</small></div><span class="pill donepill">TERMINÉ</span></div>`).join(''):'<div class="empty">Aucun travail terminé.</div>';
 document.getElementById('workMini').innerHTML=active.slice(0,3).map(x=>`<div class="task"><span class="ico">${x.icon}</span><div class="txt"><b>${esc(x.name)}</b></div><span class="pill ${x.status==='prep'?'prep':'doing'}">${workLabel(x.status)}</span></div>`).join('')||'<div class="empty">Rien à signaler.</div>';
}
function cycleWork(i){let x=data.works[i]; if(x.status==='prep')x.status='doing'; else {x.status='done';data.history.push({...x,date:new Intl.DateTimeFormat('fr-FR').format(new Date())});data.works.splice(i,1)} save();renderWorks();}
function addWork(){let n=prompt('Nom du travail à ajouter :');if(!n)return;let icon=prompt('Emoji (facultatif) :','🛠');data.works.push({name:n.trim(),icon:icon||'🛠',status:'prep'});save();renderWorks();}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function weightDateFR(d){return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'))}
function daysSince(a,b){return Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function canWeigh(){
 const last=data.weights.length?data.weights[data.weights.length-1]:null;
 if(!last)return true;
 const today=new Date().toISOString().slice(0,10);
 return daysSince(last.date,today)>=14;
}
function renderWeight(){
 const latest=data.weights[data.weights.length-1]||{value:118,date:""};
 document.getElementById('currentWeight').textContent=latest.value.toLocaleString('fr-FR',{maximumFractionDigits:1});
 const pct=Math.max(0,Math.min(100,((118-latest.value)/10)*100));
 document.getElementById('weightbar').style.width=pct+'%';
 const today=new Date().toISOString().slice(0,10);
 const allowed=canWeigh();
 document.getElementById('weighingInfo').textContent=allowed
   ? 'Pesée autorisée aujourd’hui.'
   : 'Prochaine pesée le '+weightDateFR(new Date(new Date(latest.date+'T12:00:00').getTime()+14*86400000).toISOString().slice(0,10))+'.';
 document.getElementById('weightInput').disabled=!allowed;
 document.getElementById('weightInput').style.opacity=allowed?'1':'.5';
 const h=data.weights.slice().reverse();
 document.getElementById('weightHistory').innerHTML=h.length?h.map((x,i)=>{
   const prev=h[i+1];
   let delta='';
   if(prev){const d=x.value-prev.value;delta=`<span class="${d<=0?'delta-down':'delta-up'}">${d>0?'+':''}${d.toLocaleString('fr-FR',{maximumFractionDigits:1})} kg</span>`}
   return `<div class="weight-row"><span><b>${x.value.toLocaleString('fr-FR',{maximumFractionDigits:1})} kg</b><small class="muted"> · ${weightDateFR(x.date)}</small></span>${delta}</div>`
 }).join(''):'<div class="empty">Aucune pesée enregistrée.</div>';
}
function saveWeight(){
 const err=document.getElementById('weightError'); err.textContent='';
 if(!canWeigh()){err.textContent='La pesée est limitée à une fois tous les 14 jours.';return;}
 const raw=document.getElementById('weightInput').value.replace(',','.');
 const value=Number(raw);
 if(!value || value<50 || value>250){err.textContent='Entre un poids valide (50 à 250 kg).';return;}
 const today=new Date().toISOString().slice(0,10);
 data.weights.push({date:today,value:Number(value.toFixed(1))});
 data.weights.sort((a,b)=>a.date.localeCompare(b.date));
 save();document.getElementById('weightInput').value='';renderWeight();
}
function renderDaily(){
 let d=new Date().toISOString().slice(0,10);let c=data.checks[d]||{};
 const items=[['💊','Prendre mes 3 cachets','med'],['🚴','Cardio / Basic-Fit','gym'],['🚶','Marche 1 h','walk'],['🎸','Guitare 30–60 min','guitar'],['🧠','Culture / apprentissage','culture'],['🔎','Remise en question — 5 min','reflect']];
 document.getElementById('daily').innerHTML=items.map(([i,t,k])=>`<div class="task"><span class="ico">${i}</span><div class="txt"><b>${t}</b></div><button class="check ${c[k]?'done':''}" onclick="toggle('${k}')">${c[k]?'✓':''}</button></div>`).join('');
 document.getElementById('todayTasks').innerHTML=items.map(([i,t,k])=>`<div class="task"><span class="ico">${i}</span><div class="txt"><b>${t}</b></div><span class="pill ${c[k]?'donepill':'prep'}">${c[k]?'FAIT':'À FAIRE'}</span></div>`).join('');
}
function toggle(k){let d=new Date().toISOString().slice(0,10);data.checks[d]=data.checks[d]||{};data.checks[d][k]=!data.checks[d][k];if(k==='gym'&&data.checks[d][k])data.stats.gym++;if(k==='walk'&&data.checks[d][k])data.stats.walk++;if(k==='guitar'&&data.checks[d][k])data.stats.guitar++;save();renderDaily();document.getElementById('gym').textContent=data.stats.gym;document.getElementById('walk').textContent=data.stats.walk;document.getElementById('g2').textContent=data.stats.gym;document.getElementById('gu2').textContent=data.stats.guitar;}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active')});
renderWorks();renderDaily();renderWeight();document.getElementById('streak').textContent=data.stats.streak;document.getElementById('gym').textContent=data.stats.gym;document.getElementById('walk').textContent=data.stats.walk;document.getElementById('g2').textContent=data.stats.gym;document.getElementById('gu2').textContent=data.stats.guitar;

function connectGoogle(){
 alert("La connexion Google Calendar nécessite une clé OAuth Google (Client ID) propre à cette application. La prochaine étape consiste à configurer cette autorisation ; je ne vais pas simuler une connexion qui ne fonctionne pas.");
}
</script>
</body></html>
